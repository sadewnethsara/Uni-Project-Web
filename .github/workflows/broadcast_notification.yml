name: Broadcast Market Push Notification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Broadcast Mode'
        required: true
        type: choice
        default: 'auto_verify'
        options:
          - 'auto_verify'
          - 'custom_message'
      custom_title:
        description: 'Custom Notification Title (used if mode is custom_message)'
        required: false
        type: string
        default: '📊 Wholesale Dambulla Market Data 2026.October.14 Updated'
      custom_body:
        description: 'Custom Notification Body (used if mode is custom_message)'
        required: false
        type: string
        default: 'Dambulla DEC wholesale prices have been verified and updated. Tap to explore the latest prices.'
      market_id:
        description: 'Target Market for Deep-linking'
        required: false
        type: choice
        default: 'dambulla'
        options:
          - 'dambulla'
          - 'pettah'
          - 'kandy'
          - 'keppetipola'
          - 'peliyagoda'
          - 'meegoda'
          - 'norochchole'
          - 'thambuththegama'
          - 'nuwara-eliya'
          - 'bandarawela'
          - 'veyangoda'
          - 'manning'
      topic:
        description: 'Notification Channel & Audience'
        required: true
        type: choice
        default: 'market_updates'
        options:
          - 'market_updates'
          - 'price_surges'
      force_send:
        description: 'Bypass duplicate check and force send'
        required: false
        type: boolean
        default: true

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install firebase-admin

      - name: Dispatch Notification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ "${{ github.event.inputs.mode }}" = "custom_message" ]; then
            echo "Sending custom push notification to topic: $TOPIC..."
            python scripts/maintenance/send_market_notification.py \
              --title "${{ github.event.inputs.custom_title }}" \
              --body "${{ github.event.inputs.custom_body }}" \
              --market "${{ github.event.inputs.market_id }}" \
              --topic "$TOPIC" \
              --force
          else
            echo "Running auto-verify notification for topic: $TOPIC..."
            FORCE_FLAG=""
            if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
              FORCE_FLAG="--force"
            fi
            python scripts/maintenance/send_market_notification.py --topic "$TOPIC" $FORCE_FLAG
          fi
