name: Multi-Source Market Sync (Wholesale, Retail & Historical)

on:
  schedule:
    # Runs every Monday at 06:00 UTC (11:30 AM Sri Lanka Time)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      sync_scope:
        description: 'Sync Scope / Source'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cran_historical
          - dambulla_dec
          - dcs_retail
          - dcs_retail_all
          - cbsl_reports
          - cbsl_historical
          - inflation_rates
      year:
        description: 'Target Year (Leave blank for latest / all)'
        required: false
        default: ''
        type: string

jobs:
  sync-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests urllib3 rdata pandas pdfplumber

      - name: Sync CRAN Historical Wholesale & Retail Dataset (10 Years, Pettah & Dambulla)
        if: ${{ inputs.sync_scope == 'all' || inputs.sync_scope == 'cran_historical' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting CRAN Historical Sync with Discrepancy Auditing..."
          YEAR_FLAG=""
          if [ -n "${{ inputs.year }}" ]; then
            YEAR_FLAG="--year ${{ inputs.year }}"
          fi
          python scripts/sync/sync_cran_historical.py $YEAR_FLAG

      - name: Sync Dambulla DEC Live Wholesale API (Grade A+)
        if: ${{ inputs.sync_scope == 'all' || inputs.sync_scope == 'dambulla_dec' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting Dambulla DEC Live Sync..."
          python scripts/sync/sync_dambulla_api.py

      - name: Sync DCS Colombo Retail Prices (Grade A)
        if: ${{ inputs.sync_scope == 'all' || inputs.sync_scope == 'dcs_retail' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting DCS Consumer Retail Price Sync (Latest 12 Weeks)..."
          python scripts/sync/sync_dcs_retail.py

      - name: Sync All Historical DCS Colombo Retail Prices
        if: ${{ inputs.sync_scope == 'dcs_retail_all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting Full Historical DCS Consumer Retail Price Sync..."
          python scripts/sync/sync_dcs_retail.py --all

      - name: Sync Central Bank (CBSL) Daily Price Reports (Grade B+)
        if: ${{ inputs.sync_scope == 'all' || inputs.sync_scope == 'cbsl_reports' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Checking CBSL Daily Price Reports..."
          python scripts/sync/sync_cbsl_reports.py

      - name: Sync Historical Central Bank (CBSL) Price Bulletins
        if: ${{ inputs.sync_scope == 'cbsl_historical' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting CBSL Historical Bulletins Sync..."
          YEAR_FLAG="--all"
          if [ -n "${{ inputs.year }}" ]; then
            YEAR_FLAG="--year ${{ inputs.year }}"
          fi
          python scripts/sync/sync_cbsl_historical.py $YEAR_FLAG

      - name: Refresh Trading & Holiday Calendar
        if: ${{ inputs.sync_scope == 'all' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Refreshing Market Holiday Calendar..."
          python scripts/maintenance/populate_market_calendar.py || true

      - name: Sync Sri Lanka Inflation & Rupee Rates (CCPI, NCPI, USD/LKR)
        if: ${{ inputs.sync_scope == 'all' || inputs.sync_scope == 'inflation_rates' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Syncing Sri Lanka Inflation & Rupee Rates..."
          python scripts/sync/sync_inflation_rates.py
          echo "Updating Rolling 1-Year Forward Inflation & Rupee Forecast..."
          python scripts/sync/forecast_rolling_inflation.py || true

      - name: Run Enterprise Data Quality & Hygiene Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/maintenance/audit_data_quality.py
