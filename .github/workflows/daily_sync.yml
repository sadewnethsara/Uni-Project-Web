name: Daily Supabase Database Sync

on:
  schedule:
    # Runs 3 times daily (Sri Lanka Standard Time = UTC + 5:30)
    - cron: '30 1 * * *'  # 07:00 AM Sri Lanka Time (01:30 UTC) - Morning Market Catchup
    - cron: '30 10 * * *' # 04:00 PM Sri Lanka Time (10:30 UTC) - Afternoon Bulletin Release
    - cron: '30 16 * * *' # 10:00 PM Sri Lanka Time (16:30 UTC) - Evening Final Close
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_database:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/scraper/requirements.txt
          sudo apt-get install -y ghostscript

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          npm install @supabase/supabase-js tsx

      - name: Sync CBSL Daily Price Reports (Official Central Bank Bulletins)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Syncing latest CBSL Daily Price Reports (Pettah & Dambulla)..."
          python scripts/sync/sync_cbsl_reports.py

      - name: Sync Dambulla DEC Live Auction Prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Syncing Dambulla DEC Live API prices (rolling 3-day window)..."
          python scripts/sync/sync_dambulla_api.py --days 3

      - name: Run HARTI Daily Bulletin Scraper and Sync Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          START_DATE=$(date -d "7 days ago" +%Y-%m-%d)
          echo "Starting daily HARTI sync from $START_DATE"
          
          # 1. Download PDFs (with non-blocking error handling if HARTI portal is offline)
          python scripts/scraper/download_pdfs.py --start-date $START_DATE --output-dir ./PDFs || true
          
          PDF_COUNT=$(find ./PDFs -type f -name "*.pdf" 2>/dev/null | wc -l)
          if [ "$PDF_COUNT" -gt 0 ]; then
            echo "Found $PDF_COUNT PDFs. Proceeding with extraction..."
            
            # 2. Extract Prices to JSON
            python scripts/scraper/batch_process_pdfs.py ./PDFs --output-dir ./price_data
            
            JSON_COUNT=$(find ./price_data -type f -name "*.json" 2>/dev/null | wc -l)
            if [ "$JSON_COUNT" -gt 0 ]; then
              echo "Found $JSON_COUNT JSON files. Proceeding with sync..."
              
              # 3. Sync to Supabase
              npx tsx scripts/sync/sync_data.ts
            else
              echo "No JSON files generated. Skipping sync."
            fi
          else
            echo "No HARTI PDFs found for the last 7 days. Continuing with multi-source sync."
          fi

          # Purge scratch files to stay within runner disk limits
          rm -rf ./PDFs/* ./price_data/*

      - name: Run Enterprise Data Quality & Hygiene Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/maintenance/audit_data_quality.py
