name: Daily Supabase Database Sync

on:
  schedule:
    - cron: '30 16 * * *' # Runs daily at 10:00 PM Sri Lanka Time (16:30 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/scraper/requirements.txt
          sudo apt-get install -y ghostscript

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          npm install @supabase/supabase-js tsx

      - name: Run Scraper and Sync Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          START_DATE=$(date -d "7 days ago" +%Y-%m-%d)
          echo "Starting daily sync from $START_DATE"
          
          # 1. Download PDFs
          python scripts/scraper/download_pdfs.py --start-date $START_DATE --output-dir ./PDFs
          
          PDF_COUNT=$(find ./PDFs -type f -name "*.pdf" 2>/dev/null | wc -l)
          if [ "$PDF_COUNT" -gt 0 ]; then
            echo "Found $PDF_COUNT PDFs. Proceeding with extraction..."
            
            # 2. Extract Prices to JSON
            python scripts/scraper/batch_process_pdfs.py ./PDFs --output-dir ./price_data
            
            JSON_COUNT=$(find ./price_data -type f -name "*.json" 2>/dev/null | wc -l)
            if [ "$JSON_COUNT" -gt 0 ]; then
              echo "Found $JSON_COUNT JSON files. Proceeding with sync..."
              
              # 3. Sync to Supabase
              npx tsx scripts/sync/sync_data.ts
            else
              echo "No JSON files generated. Skipping sync."
            fi
          else
            echo "No PDFs found for the last 7 days. Skipping extraction and sync."
          fi
