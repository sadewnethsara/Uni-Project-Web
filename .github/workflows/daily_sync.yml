name: Daily Supabase Database Sync

on:
  schedule:
    - cron: '30 16 * * *' # Runs daily at 10:00 PM Sri Lanka Time (16:30 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/scraper/requirements.txt
          sudo apt-get install -y ghostscript

      - name: Run Python Scraper (Download PDFs)
        run: |
          START_DATE=$(date -d "7 days ago" +%Y-%m-%d)
          python scripts/scraper/download_pdfs.py --start-date $START_DATE --output-dir ./PDFs
        
      - name: Run Python Scraper (Extract Prices)
        run: |
          python scripts/scraper/batch_process_pdfs.py --pdf-dir ./PDFs --output-dir ./price_data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          npm install @supabase/supabase-js tsx

      - name: Run Supabase Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/sync_data.ts
